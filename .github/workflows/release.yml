name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
      dry-run:
        description: Run npm publish without publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: ci
    uses: cobycloud/actions/.github/workflows/reusable-github-release.yml@main
    with:
      tag-name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      draft: false
      prerelease: false

  npm-publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cobycloud/actions/actions/npm-publish@main
        with:
          package-directory: packages/file-browser
          install-directory: .
          cache-dependency-path: pnpm-lock.yaml
          install-command: corepack enable && pnpm install --frozen-lockfile
          build-command: pnpm --filter @groupsum/file-browser run build
          test-command: pnpm --filter @groupsum/file-browser run typecheck
          scope: "@groupsum"
          npm-token: ${{ secrets.NPM_API_TOKEN }}
          access: public
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
