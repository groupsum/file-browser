name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm:
    uses: cobycloud/actions/.github/workflows/reusable-pnpm-monorepo-ci.yml@main
    with:
      node-versions: '["20","22"]'
      package-cells: '[{"name":"file-browser","path":"packages/file-browser"}]'
      install-command: pnpm install --frozen-lockfile
      lint-command: pnpm run lint
      typecheck-command: pnpm run typecheck
      test-command: ""
      build-command: pnpm run build

  uv-ssot:
    uses: cobycloud/actions/.github/workflows/reusable-uv-monorepo-ci.yml@main
    with:
      python-versions: '["3.12"]'
      package-cells: '[{"name":"workspace","path":"."}]'
      install-command: uv sync --all-groups --frozen
      compile-command: ""
      test-command: uv run ssot validate .
